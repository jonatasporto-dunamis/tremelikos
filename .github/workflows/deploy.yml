name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup env for build
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=placeholder" >> $GITHUB_ENV
          echo "WAHA_API_URL=http://placeholder:3000" >> $GITHUB_ENV
          echo "WAHA_API_KEY=placeholder" >> $GITHUB_ENV
          echo "WAHA_SESSION_NAME=tremelikos" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_STORE_NAME=Tremeliko's Burguer" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_STORE_PHONE=5573991542371" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_MINIMUM_ORDER=15.00" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_TIMEZONE=America/Sao_Paulo" >> $GITHUB_ENV

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/tremelikos
            git pull origin master
            npm ci
            npm run build
            pm2 restart tremelikos
